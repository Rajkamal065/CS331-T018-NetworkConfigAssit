services:
  netops-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netops-assistant
    ports:
      - '5000:5000'    # Web UI & API
    environment:
      - LLM_PROVIDER=groq
      - NETOPS_HOST=0.0.0.0
      - NETOPS_PORT=5000
      - DEBUG=false
    volumes:
      - ./rules:/app/rules
      - ./logs:/app/logs
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
