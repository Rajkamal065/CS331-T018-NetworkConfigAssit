services:
  mcp-server:
    build: .
    container_name: netops_mcp_server
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - path: .env
        required: false
    volumes:
      - ./rules:/app/rules
    command: ["python", "server.py"]
    restart: unless-stopped
